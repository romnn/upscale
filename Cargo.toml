[workspace]
resolver = "2"
members = ["crates/sd-upscale", "crates/candle-upscale", "crates/cli", "crates/web"]
# `web` is wasm-only, so it's excluded from `default-members`: plain native
# `cargo`/`task check`/`task test` operate on `sd-upscale`, while `task check:fc`
# / `task lint:fc` build `web` on wasm via its `package.metadata.cargo-fc`.
default-members = ["crates/sd-upscale"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
burn = { version = "0.21", default-features = false }
burn-store = { version = "0.21", default-features = false }

[workspace.metadata.cargo-fc]
install_missing_targets = true

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
allow_attributes_without_reason = "deny"
struct_excessive_bools = "allow"
# Numeric ML code: value-preserving casts (`as f32`/`as usize`), fixed-index
# accesses into known-shape tensors, by-value tensor ownership (burn ops consume
# tensors, so passing by ref would just force clones), short math names
# (b, c, h, w), many-arg block constructors, and doc/`#[must_use]` niceties are
# noise here, not signal. The correctness denies below stay on.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
many_single_char_names = "allow"
needless_pass_by_value = "allow"
too_many_arguments = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

# Compile dependencies optimized even in dev/test: burn + ndarray conv/matmul are
# unusably slow at opt-level 0, while keeping our own crates unoptimized for fast
# incremental rebuilds.
[profile.dev.package."*"]
opt-level = 3
