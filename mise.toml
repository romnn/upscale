[tools]
zig = "latest"
task = "latest"
ast-grep = "latest"
typos = "latest"
actionlint = "latest"
# trunkrs.dev wasm bundler for the web dev loop. Backend-qualified because the
# bare `trunk` registry name resolves to trunk.io's linter instead.
"github:trunk-rs/trunk" = "latest"

# micromux runs the web dev stack (trunk + model file server) from micromux.yaml.
"github:romnn/micromux" = "latest"

"github:rust-cross/cargo-zigbuild" = "latest"
"github:romnn/cargo-feature-combinations" = { version = "latest", matching = "cargo-fc" }
"aqua:rustsec/rustsec/cargo-audit" = "latest"
"github:est31/cargo-udeps" = "latest"
"github:kbknapp/cargo-outdated" = "latest"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "macos-arm64",
  "windows-x64",
]
