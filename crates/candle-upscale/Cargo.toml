[package]
name = "candle-upscale"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Multi-model candle image upscaler (SD x4 latent diffusion, with more models to come)."
publish = false

[lints]
workspace = true

# Vary every model feature on every target. CUDA is Linux-only in this matrix;
# Metal is macOS-only. The default umbrella is redundant with explicit models.
[package.metadata.cargo-fc]
exclude_features = ["default"]

[package.metadata.cargo-fc.target.'cfg(not(target_os = "linux"))']
exclude_features = { add = ["cuda"] }

[package.metadata.cargo-fc.target.'cfg(not(target_os = "macos"))']
exclude_features = { add = ["metal"] }

[dependencies]
# candle 0.10 is what `burn-candle` already locks into this workspace, so pinning
# it here unifies to a single `candle-core` (one kernel build) rather than a
# second, duplicate version. The `cuda` feature (default) turns on GPU kernels;
# without it candle falls back to CPU so the crate builds toolkit-free.
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
candle-flash-attn = { version = "0.10", optional = true }

[features]
default = ["sdx4", "vosr", "tvt"]
sdx4 = []
vosr = []
tvt = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:candle-flash-attn"]
metal = ["candle-core/metal", "candle-nn/metal"]

[dev-dependencies]
# PNG I/O for the parity example (loads a real image crop, writes the output).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[example]]
name = "parity_candle"
required-features = ["cuda", "sdx4"]
