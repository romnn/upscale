[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native candle-only multi-model image upscaler CLI."
publish = false

[lints]
workspace = true

# `cuda`/`metal` need a GPU toolkit, which CI / cross-target lint lacks. The
# model features are toolkit-free (they gate candle model code), so the base
# config still exercises every model on candle's CPU backend.
[package.metadata.cargo-fc]
exclude_features = ["cuda", "metal"]

[[bin]]
name = "sd-upscale"
path = "src/main.rs"

[dependencies]
candle-upscale = { path = "../candle-upscale", default-features = false }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
indicatif = "0.17"

[features]
default = ["model-sdx4", "model-vosr", "model-tvt"]
model-sdx4 = ["candle-upscale/sdx4"]
model-vosr = ["candle-upscale/vosr"]
model-tvt = ["candle-upscale/tvt"]
cuda = ["candle-upscale/cuda"]
metal = ["candle-upscale/metal"]
